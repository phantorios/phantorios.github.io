<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  body{
    background:#FBF9F6; color:#17130F;
    font-family:'IBM Plex Sans',sans-serif;
    display:grid; grid-template-rows:auto 1fr auto;
    padding:62px 80px; box-sizing:border-box;
  }
  .top{display:flex; justify-content:space-between; align-items:baseline;
       font-family:'IBM Plex Mono',monospace; font-size:21px; color:#5F5852}
  .top b{color:#C2410C; font-weight:500}
  .mid{align-self:center}
  h1{font-family:'Archivo',sans-serif; font-weight:800; font-size:100px;
     line-height:.94; letter-spacing:-.04em; margin:0 0 24px}
  .role{font-size:31px; line-height:1.3; color:#17130F; margin:0; max-width:26em}
  .bottom{border-top:1px solid #E2DCD4; padding-top:20px;
          font-family:'IBM Plex Mono',monospace; font-size:20px; color:#5F5852}
  .bottom em{font-style:normal; color:#C2410C; margin:0 12px}
</style>
</head>
<body>
  <div class="top"><span>anthony<b>.</b>setiawan</span><span>phantorios.github.io</span></div>
  <div class="mid">
    <h1>Anthony<br>Setiawan</h1>
    <p class="role">Fullstack developer and cloud engineer. Enterprise platforms, SaaS and CI/CD on Azure.</p>
  </div>
  <div class="bottom">six roles<em>·</em>two countries<em>·</em>AZ-900 certified<em>·</em>IELTS 7.0</div>
</body>
</html>
